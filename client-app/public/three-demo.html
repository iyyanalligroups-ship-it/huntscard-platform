<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HuntsTAG Three.js motion templates</title>
<style>
  :root { --canvas:#f2f0eb; --ink:#292827; --stone:#666; --mist:#e3e3e2; --wine:#421d24; --lilac:#d4c7ff; --lagoon:#0c4243; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, system-ui, sans-serif; background: var(--canvas); color: var(--ink); }
  header { padding: 28px 24px 8px; max-width: 1200px; margin: auto; }
  h1 { font-weight: 460; letter-spacing: -0.03em; font-size: 2.2rem; margin: 0 0 6px; }
  p.sub { color: var(--stone); margin: 0 0 18px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
  .tabs button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--mist); background: transparent; cursor: pointer; color: var(--ink); }
  .tabs button.on { background: var(--wine); color: #fff; border-color: var(--wine); }
  .stage { max-width: 1200px; margin: 0 auto 24px; padding: 0 24px; }
  .frame { position: relative; height: min(66vh, 620px); border-radius: 16px; overflow: hidden; border: 1px solid var(--mist); background: #fff; }
  .frame.dark { background: var(--lagoon); }
  canvas { display:block; width:100%; height:100%; }
  .cap { position:absolute; left:20px; bottom:16px; right:20px; color: var(--ink); font-size: .9rem; pointer-events:none; }
  .frame.dark .cap { color: #fff; }
  .cap b { font-weight: 560; }
  .use { max-width: 1200px; margin: 0 auto 40px; padding: 0 24px; color: var(--stone); font-size: .95rem; }
</style>
</head>
<body>
<header>
  <h1>Three.js motion templates for HuntsTAG</h1>
  <p class="sub">Move the mouse over each scene. Pick the one you like and I will wire it into the Home hero.</p>
  <div class="tabs" id="tabs">
    <button data-k="card" class="on">1 · Floating NFC card</button>
    <button data-k="tap">2 · Tap ripple</button>
    <button data-k="waves">3 · Particle wave field</button>
    <button data-k="orbit">4 · Orbit rings</button>
  </div>
</header>
<div class="stage"><div class="frame" id="frame"><div class="cap" id="cap"></div></div></div>
<div class="use" id="use"></div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const frame = document.getElementById('frame');
const cap = document.getElementById('cap');
const use = document.getElementById('use');
const mouse = { x: 0, y: 0 };
frame.addEventListener('pointermove', (e) => {
  const r = frame.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -(((e.clientY - r.top) / r.height) * 2 - 1);
});

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
frame.prepend(renderer.domElement);

let scene, camera, tick, current;
const clock = new THREE.Clock();

function resize() {
  const w = frame.clientWidth, h = frame.clientHeight;
  renderer.setSize(w, h, false);
  if (camera) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
}
addEventListener('resize', resize);

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  return s;
}

function cardTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 640;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 1024, 640);
  grad.addColorStop(0, '#421d24'); grad.addColorStop(1, '#6d2c3a');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 640);
  g.fillStyle = '#d4c7ff'; g.beginPath(); g.roundRect(70, 80, 120, 90, 14); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
  for (let i = 1; i <= 3; i++) { g.beginPath(); g.arc(900, 130, 18 * i, -0.9, 0.9); g.stroke(); }
  g.fillStyle = '#fff'; g.font = '600 64px Inter, sans-serif'; g.fillText('Alex Chen', 70, 480);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = '500 30px Inter, sans-serif'; g.fillText('FOUNDER · STUDIO NINE', 70, 535);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

const SCENES = {
  card: {
    dark: false,
    cap: '<b>Floating NFC card</b> — the card tilts toward the cursor and bobs, with soft light sweeping across it.',
    use: 'Best for the Home hero (replaces the flat card). Cheap to render and easy to put your real card artwork on.',
    build() {
      camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100); camera.position.set(0, 0, 9);
      scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 4, 6); scene.add(key);
      const geo = new THREE.ExtrudeGeometry(roundedRect(5, 3.1, 0.28), { depth: 0.06, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4 });
      geo.computeBoundingBox();
      const uv = geo.attributes.uv, pos = geo.attributes.position;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + 2.5) / 5, (pos.getY(i) + 1.55) / 3.1);
      const mat = new THREE.MeshStandardMaterial({ map: cardTexture(), roughness: 0.35, metalness: 0.15 });
      const card = new THREE.Mesh(geo, mat); scene.add(card);
      const shadow = new THREE.Mesh(new THREE.CircleGeometry(2.2, 48), new THREE.MeshBasicMaterial({ color: 0x421d24, transparent: true, opacity: 0.12 }));
      shadow.position.set(0, -2.6, -1); shadow.scale.set(1.3, 0.18, 1); scene.add(shadow);
      const sweep = new THREE.PointLight(0xd4c7ff, 30, 12); scene.add(sweep);
      tick = (t) => {
        card.rotation.y += ((mouse.x * 0.55 + Math.sin(t * 0.6) * 0.12) - card.rotation.y) * 0.06;
        card.rotation.x += ((-mouse.y * 0.35) - card.rotation.x) * 0.06;
        card.position.y = Math.sin(t * 1.1) * 0.14;
        sweep.position.set(Math.sin(t * 0.9) * 3.5, Math.cos(t * 0.7) * 1.5, 2.5);
        shadow.material.opacity = 0.1 + Math.sin(t * 1.1) * 0.02;
      };
    },
  },
  tap: {
    dark: true,
    cap: '<b>Tap ripple</b> — rings expand from the card on a loop, like an NFC tap. Click anywhere to send a ripple.',
    use: 'Best as a background behind the “Shop Cards” section or a tap-to-share explainer.',
    build() {
      camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100); camera.position.set(0, 0, 10);
      scene = new THREE.Scene();
      const rings = [];
      const mkRing = () => {
        const m = new THREE.Mesh(new THREE.RingGeometry(0.98, 1, 96), new THREE.MeshBasicMaterial({ color: 0xd4c7ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
        m.userData.born = clock.elapsedTime; scene.add(m); rings.push(m); return m;
      };
      const core = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.5, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      scene.add(core);
      let next = 0;
      frame.addEventListener('click', () => mkRing());
      tick = (t) => {
        if (t > next) { mkRing(); next = t + 1.2; }
        for (let i = rings.length - 1; i >= 0; i--) {
          const age = t - rings[i].userData.born, s = 1 + age * 2.4;
          rings[i].scale.set(s, s, 1); rings[i].material.opacity = Math.max(0, 0.9 - age * 0.3);
          if (age > 3) { scene.remove(rings[i]); rings.splice(i, 1); }
        }
        core.rotation.y = mouse.x * 0.5; core.rotation.x = -mouse.y * 0.3;
      };
    },
  },
  waves: {
    dark: false,
    cap: '<b>Particle wave field</b> — thousands of points ripple like a soft sheet; the cursor pushes the wave.',
    use: 'Best as a subtle full-width background for the hero or the footer. Keep point count low on phones.',
    build() {
      camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100); camera.position.set(0, 4.2, 9); camera.lookAt(0, 0, 0);
      scene = new THREE.Scene();
      const N = 90, geo = new THREE.BufferGeometry(), arr = new Float32Array(N * N * 3);
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const k = (i * N + j) * 3; arr[k] = (i - N / 2) * 0.22; arr[k + 1] = 0; arr[k + 2] = (j - N / 2) * 0.22; }
      geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x421d24, size: 0.05, transparent: true, opacity: 0.75 }));
      scene.add(pts);
      tick = (t) => {
        const a = geo.attributes.position.array;
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
          const k = (i * N + j) * 3, x = a[k], z = a[k + 2];
          const d = Math.hypot(x - mouse.x * 6, z + mouse.y * 4);
          a[k + 1] = Math.sin(x * 0.7 + t * 1.2) * 0.35 + Math.cos(z * 0.6 + t) * 0.3 + Math.exp(-d * d * 0.12) * 0.9;
        }
        geo.attributes.position.needsUpdate = true;
        pts.rotation.y = mouse.x * 0.15;
      };
    },
  },
  orbit: {
    dark: true,
    cap: '<b>Orbit rings</b> — glowing rings and small satellites circle a core, reacting to the cursor.',
    use: 'Best for a “Magic Poster / AR” feature band, where a techy, dimensional look fits.',
    build() {
      camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100); camera.position.set(0, 0, 9);
      scene = new THREE.Scene();
      const group = new THREE.Group(); scene.add(group);
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 1), new THREE.MeshBasicMaterial({ color: 0xd4c7ff, wireframe: true }));
      group.add(core);
      const rings = [];
      [2, 2.8, 3.6].forEach((r, i) => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 8, 160), new THREE.MeshBasicMaterial({ color: i === 1 ? 0xffffff : 0xd4c7ff, transparent: true, opacity: 0.7 }));
        ring.rotation.x = Math.PI / 2.4 + i * 0.35; ring.rotation.y = i * 0.6; group.add(ring);
        const sat = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        ring.add(sat); rings.push({ ring, sat, r, speed: 0.5 + i * 0.25 });
      });
      tick = (t) => {
        rings.forEach(({ ring, sat, r, speed }) => { sat.position.set(Math.cos(t * speed) * r, Math.sin(t * speed) * r, 0); ring.rotation.z = t * 0.05; });
        core.rotation.x = t * 0.4; core.rotation.y = t * 0.3;
        group.rotation.y += ((mouse.x * 0.8) - group.rotation.y) * 0.05;
        group.rotation.x += ((-mouse.y * 0.5) - group.rotation.x) * 0.05;
      };
    },
  },
};

function show(key) {
  current = key;
  const s = SCENES[key];
  frame.classList.toggle('dark', s.dark);
  s.build();
  cap.innerHTML = s.cap; use.textContent = 'Where to use it: ' + s.use;
  renderer.setClearColor(0x000000, 0);
  resize();
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.k === key));
}
document.getElementById('tabs').addEventListener('click', (e) => { const k = e.target.dataset?.k; if (k) show(k); });

renderer.setAnimationLoop(() => { if (tick) tick(clock.elapsedTime); renderer.render(scene, camera); });
show('card');
</script>
</body>
</html>
